<html lang="en">

    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; letter-spacing:0; }
    .page { width:min(1360px, calc(100vw - 48px)); margin:0 auto; padding:28px 0 42px; }
    .topbar { display:flex; justify-content:flex-end; margin-bottom:18px; }
    .lang-btn { border:1px solid rgba(0,0,0,.08); background:rgba(255,255,255,.86); border-radius:999px; padding:8px 14px; font-size:13px; cursor:pointer; box-shadow:0 8px 24px rgba(0,0,0,.045); }
    .hero { display:flex; align-items:flex-end; justify-content:space-between; gap:24px; margin-bottom:18px; }
    h1 { margin:0; font-size:40px; line-height:1.08; font-weight:650; }
    .subtitle { margin-top:8px; color:var(--muted); font-size:14px; }
    .control-card,.stats-card,.chart-card,.table-card { background:var(--card); border:1px solid rgba(0,0,0,.06); border-radius:18px; box-shadow:0 18px 42px rgba(0,0,0,.055); }
    .control-card { min-width:300px; padding:14px 16px; }
    .control-label { color:var(--muted); font-size:12px; margin-bottom:8px; }
    select { width:100%; border:1px solid var(--line); background:#fff; color:var(--text); border-radius:12px; padding:10px 12px; font-size:14px; outline:none; }
    .stats-card { padding:10px 14px; margin-bottom:16px; overflow-x:auto; }
    .stats-table { width:100%; min-width:900px; border-collapse:collapse; }
    .stats-table th { color:var(--muted); font-size:12px; font-weight:600; padding:8px 12px 4px; text-align:left; border:0; white-space:nowrap; }
    .stats-table td { font-size:19px; font-weight:650; padding:2px 12px 8px; text-align:left; border:0; white-space:nowrap; }
    .grid { display:grid; grid-template-columns:1fr; gap:16px; }
    .chart-card { padding:8px 10px 0; overflow:hidden; }
    .tables { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .table-card { padding:16px; min-height:340px; }
    .section-title { font-size:17px; font-weight:650; margin-bottom:12px; }
    .table-scroll { max-height:300px; overflow-y:auto; border:1px solid var(--line); border-radius:12px; background:#fff; }
    table { width:100%; border-collapse:collapse; font-size:12px; }
    thead th { position:sticky; top:0; z-index:1; background:rgba(250,250,252,.96); color:var(--muted); font-weight:600; }
    th,td { padding:9px 10px; border-bottom:1px solid #f0f0f2; white-space:nowrap; text-align:right; }
    th:first-child,td:first-child,th:nth-child(2),td:nth-child(2) { text-align:left; }
    @media (max-width:980px) { .hero { display:block; } .control-card { margin-top:16px; } .tables { grid-template-columns:1fr; } }
  </style>
</head>

    const ORDER = ["optimization", "stable", "aggressive"];
    let currentLang = "en";
    const select = document.getElementById("strategySelect");
    const langButton = document.getElementById("langToggle");
    const translations = {
      "Time":"时间","Action":"动作","Qty":"数量","Position":"仓位","Price":"价格","P/L":"盈亏",
      "Signal":"信号","Equity":"权益","Buy":"买入","Sell":"卖出","Hold":"持有","Long":"多信号","Short":"空信号","Flat":"空仓"
    };
    function money(v) { return "$" + Number(v).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2}); }
    function pct(v) { return (Number(v) * 100).toFixed(2) + "%"; }
    function num(v, d=4) { return Number(v).toFixed(d); }
    function label(text) { return currentLang === "zh" && translations[text] ? translations[text] : text; }
    function optionLabel(key) { return currentLang === "zh" ? DATA[key].summary.label_zh : DATA[key].summary.label_en; }
    function fillOptions() {
      const selected = select.value || "optimization";
      select.innerHTML = ORDER.map(k => `<option value="${k}">${optionLabel(k)}</option>`).join("");
      select.value = selected;
    }
    function chartLayout(ytitle) {
      return {
        template: "plotly_white", height: 330, margin: {l:48,r:24,t:12,b:34},
        paper_bgcolor:"#ffffff", plot_bgcolor:"#ffffff",
        font: {family:"-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif", color:"#1d1d1f"},
        legend: {orientation:"h", yanchor:"bottom", y:1.03, xanchor:"left", x:0},
        hovermode:"x unified",
        xaxis: {showgrid:false, zeroline:false, linecolor:"#e5e5ea"},
        yaxis: {title:ytitle, gridcolor:"#f2f2f7", zeroline:false}
      };
    }
    function render() {
      const data = DATA[select.value || "optimization"];
      const rows = data.records;
      const s = data.summary;
      document.getElementById("statEquity").textContent = money(s.final_equity);
      document.getElementById("statReturn").textContent = pct(s.total_return);
      document.getElementById("statProfit").textContent = money(s.total_profit);
      document.getElementById("statMdd").textContent = pct(s.max_drawdown);
      document.getElementById("statPosition").textContent = num(s.current_position, 4) + " BTC";
      document.getElementById("statTrades").textContent = s.trades;
      const x = rows.map(r => r.date);
      const price = rows.map(r => r.price);
      const equity = rows.map(r => r.equity);
      const position = rows.map(r => r.position);
      const trades = rows.filter(r => r.is_trade);
      const buys = trades.filter(r => r.action === "Buy");
      const sells = trades.filter(r => r.action === "Sell");
      Plotly.react("priceChart", [
        {x, y: price, type:"scatter", mode:"lines", name:"BTC", line:{color:"#1d1d1f", width:1.8}},
        {x: buys.map(r=>r.date), y: buys.map(r=>r.price), type:"scatter", mode:"markers", name:label("Buy"), marker:{color:"#34c759", size:10, symbol:"triangle-up"}},
        {x: sells.map(r=>r.date), y: sells.map(r=>r.price), type:"scatter", mode:"markers", name:label("Sell"), marker:{color:"#ff3b30", size:10, symbol:"triangle-down"}}
      ], chartLayout("BTC"));
      const ymin = Math.min(...equity), ymax = Math.max(...equity), pad = Math.max((ymax-ymin)*0.08, 100);
      const eqLayout = chartLayout("USD");
      eqLayout.yaxis.range = [ymin - pad, ymax + pad];
      Plotly.react("equityChart", [{x, y: equity, type:"scatter", mode:"lines", name:label("Equity"), line:{color:"#0071e3", width:2.4}}], eqLayout);
      Plotly.react("positionChart", [{x, y: position, type:"scatter", mode:"lines", name:label("Position"), line:{color:"#5856d6", width:2, shape:"hv"}}], chartLayout("BTC"));
      document.getElementById("tradeRows").innerHTML = trades.slice().reverse().map(r =>
        `<tr><td>${r.date}</td><td>${label(r.action)}</td><td>${num(r.qty,4)}</td><td>${num(r.position,4)}</td><td>${money(r.price)}</td><td>${money(r.pl)}</td></tr>`
      ).join("");
      document.getElementById("signalRows").innerHTML = rows.slice().reverse().map(r =>
        `<tr><td>${r.date}</td><td>${label(r.signal)}</td><td>${num(r.position,4)}</td><td>${money(r.price)}</td><td>${money(r.equity)}</td></tr>`
      ).join("");
      translateTables();
    }
    function translatePage() {
      document.documentElement.lang = currentLang;
      langButton.textContent = currentLang === "zh" ? "English" : "中文";
      document.querySelectorAll(".trans").forEach(el => { el.textContent = currentLang === "zh" ? el.dataset.zh : el.dataset.en; });
      fillOptions();
      translateTables();
    }
    function translateTables() {
      const toZh = currentLang === "zh";
      const walker = document.createTreeWalker(document.querySelector(".tables"), NodeFilter.SHOW_TEXT);
      const nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);
      nodes.forEach(node => {
        const raw = node.nodeValue;
        const text = raw.trim();
        if (!text) return;
        if (toZh && translations[text]) node.nodeValue = raw.replace(text, translations[text]);
        if (!toZh) Object.entries(translations).forEach(([en, zh]) => { if (text === zh) node.nodeValue = raw.replace(text, en); });
      });
    }
    select.addEventListener("change", render);
    langButton.addEventListener("click", () => { currentLang = currentLang === "en" ? "zh" : "en"; translatePage(); render(); });
    fillOptions();
    render();
  </script>
