    .stats-table th { color:var(--muted); font-size:12px; font-weight:600; padding:8px 12px 4px; text-align:left; border:0; white-space:nowrap; }

    .grid { display:grid; grid-template-columns:1fr; gap:16px; }
    .chart-card { padding:8px 10px 0; overflow:hidden; }
    .tables { display:grid; grid-template-columns:1fr 1fr; gap:16px; }

99999, "nav": 1.0847831757142856, "profit": 593.4822299999988, "side": "SELL", "action": "Sell", "qty": -0.6, "position": -0.3, "net_pos": 0.3, "pl": -662.85, "signal": "Short", "symbol": "BTCUSDC"}, {"date": "2026-06-04 23:59:00", "price": 64310.9, "equity": 10950.002229999998, "nav": 1.5642860328571426, "profit": 3950.002229999999, "side": "BUY", "action": "Buy", "qty": 0.6, "position": 0.3, "net_pos": -0.3, "pl": 3356.5200000000004, "signal": "Long", "symbol": "BTCUSDC"}]}};
    let currentLang = "en";
    const START_CAPITAL = 7000.0;
    const select = document.getElementById("strategySelect");
    const langButton = document.getElementById("langToggle");

    const translations = {
      "Time":"时间","Action":"动作","Qty":"数量","Position":"仓位","Price":"价格","P/L":"盈亏",
      "Signal":"信号","Equity":"权益","Buy":"买入","Sell":"卖出","Long":"多信号","Short":"空信号","Flat":"空仓"
    };

    function money(v) { return "$" + Number(v).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2}); }
    function pct(v) { return (Number(v) * 100).toFixed(2) + "%"; }
    function num(v, d=4) { return Number(v).toFixed(d); }
    function label(text) { return currentLang === "zh" && translations[text] ? translations[text] : text; }

    function chartLayout(ytitle) {
      return {
        template: "plotly_white", height: 330, margin: {l:48,r:24,t:12,b:34},
        paper_bgcolor:"#ffffff", plot_bgcolor:"#ffffff",
        font: {family:"-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif", color:"#1d1d1f"},
        legend: {orientation:"h", yanchor:"bottom", y:1.03, xanchor:"left", x:0},
        hovermode:"x unified",
        xaxis: {showgrid:false, zeroline:false, linecolor:"#e5e5ea"},
        yaxis: {title:ytitle, gridcolor:"#f2f2f7", zeroline:false}
      };
    }

    function render() {
      const key = select.value;
      const data = DATA[key];
      const rows = data.records;
      const s = data.summary;
      document.getElementById("statEquity").textContent = money(s.final_equity);
      document.getElementById("statReturn").textContent = pct(s.total_return);
      document.getElementById("statProfit").textContent = money(s.total_profit);
      document.getElementById("statMdd").textContent = pct(s.max_drawdown);
      document.getElementById("statPosition").textContent = num(s.current_position, 4) + " BTC";
      document.getElementById("statTrades").textContent = s.trades;

      const x = rows.map(r => r.date);
      const price = rows.map(r => r.price);
      const equity = rows.map(r => r.equity);
      const position = rows.map(r => r.position);
      const buys = rows.filter(r => r.side === "BUY");
      const sells = rows.filter(r => r.side === "SELL");

      Plotly.react("priceChart", [
        {x, y: price, type:"scatter", mode:"lines", name:"BTC", line:{color:"#1d1d1f", width:1.8}},
        {x: buys.map(r=>r.date), y: buys.map(r=>r.price), type:"scatter", mode:"markers", name:label("Buy"), marker:{color:"#34c759", size:10, symbol:"triangle-up"}},
        {x: sells.map(r=>r.date), y: sells.map(r=>r.price), type:"scatter", mode:"markers", name:label("Sell"), marker:{color:"#ff3b30", size:10, symbol:"triangle-down"}}
      ], chartLayout("BTC"));

      const ymin = Math.min(...equity), ymax = Math.max(...equity), pad = Math.max((ymax-ymin)*0.08, 100);
      const eqLayout = chartLayout("USD");
      eqLayout.yaxis.range = [ymin - pad, ymax + pad];
      Plotly.react("equityChart", [
        {x, y: equity, type:"scatter", mode:"lines", name:label("Equity"), line:{color:"#0071e3", width:2.4}}
      ], eqLayout);

      Plotly.react("positionChart", [
        {x, y: position, type:"scatter", mode:"lines", name:label("Position"), line:{color:"#5856d6", width:2, shape:"hv"}}
      ], chartLayout("BTC"));

      document.getElementById("tradeRows").innerHTML = rows.slice().reverse().map(r =>
        `<tr><td>${r.date}</td><td>${label(r.action)}</td><td>${num(r.qty,4)}</td><td>${num(r.position,4)}</td><td>${money(r.price)}</td><td>${money(r.pl)}</td></tr>`
      ).join("");
      document.getElementById("signalRows").innerHTML = rows.slice().reverse().map(r =>
        `<tr><td>${r.date}</td><td>${label(r.signal)}</td><td>${num(r.position,4)}</td><td>${money(r.price)}</td><td>${money(r.equity)}</td></tr>`
      ).join("");
      translateTables();
    }

    function translatePage() {
      document.documentElement.lang = currentLang;
      langButton.textContent = currentLang === "zh" ? "English" : "中文";
      document.querySelectorAll(".trans").forEach(el => { el.textContent = currentLang === "zh" ? el.dataset.zh : el.dataset.en; });
      Array.from(select.options).forEach(opt => { opt.textContent = currentLang === "zh" ? opt.dataset.zh : opt.dataset.en; });
      translateTables();
    }

    function translateTables() {
      const toZh = currentLang === "zh";
      const walker = document.createTreeWalker(document.querySelector(".tables"), NodeFilter.SHOW_TEXT);
      const nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);
      nodes.forEach(node => {
        const raw = node.nodeValue;
        const text = raw.trim();
        if (!text) return;
        if (toZh && translations[text]) node.nodeValue = raw.replace(text, translations[text]);
        if (!toZh) Object.entries(translations).forEach(([en, zh]) => { if (text === zh) node.nodeValue = raw.replace(text, en); });
      });
    }

    select.addEventListener("change", render);
    langButton.addEventListener("click", () => { currentLang = currentLang === "en" ? "zh" : "en"; translatePage(); render(); });
    render();
  </script>
